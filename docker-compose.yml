name: understudy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: understudy
      POSTGRES_USER: understudy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-understudy}
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U understudy -d understudy"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: ${UNDERSTUDY_WEB_IMAGE:-understudy-web:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://understudy:${POSTGRES_PASSWORD:-understudy}@postgres:5432/understudy
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      UNDERSTUDY_SECRET_KEY: ${UNDERSTUDY_SECRET_KEY:-}
      UNDERSTUDY_HOST_TOKEN: ${UNDERSTUDY_HOST_TOKEN:?set UNDERSTUDY_HOST_TOKEN in .env}
      UNDERSTUDY_PUBLIC_URL: ${UNDERSTUDY_PUBLIC_URL:-http://localhost:3000}
      UNDERSTUDY_COMPUTER_SERVER_URL: ${UNDERSTUDY_COMPUTER_SERVER_URL:-http://host.docker.internal:3000}
      UNDERSTUDY_COMPUTER_IMAGE: ${UNDERSTUDY_COMPUTER_IMAGE:-understudy-computer:local}
      UNDERSTUDY_ALLOWED_EMAIL_DOMAIN: ${UNDERSTUDY_ALLOWED_EMAIL_DOMAIN:-}
      UNDERSTUDY_ADMIN_EMAILS: ${UNDERSTUDY_ADMIN_EMAILS:-}
      UNDERSTUDY_PRODUCT_NAME: ${UNDERSTUDY_PRODUCT_NAME:-}
      UNDERSTUDY_LOCALE: ${UNDERSTUDY_LOCALE:-en}
      UNDERSTUDY_TIMEZONE: ${UNDERSTUDY_TIMEZONE:-UTC}
      UNDERSTUDY_BRIEFING_CRON: ${UNDERSTUDY_BRIEFING_CRON:-0 8 * * 1-5}
      UNDERSTUDY_HOST_IDS: ${UNDERSTUDY_HOST_IDS:-local}
      UNDERSTUDY_BLOCKED_CIDRS: ${UNDERSTUDY_BLOCKED_CIDRS:-}
      UNDERSTUDY_INBOUND_EMAIL_DOMAIN: ${UNDERSTUDY_INBOUND_EMAIL_DOMAIN:-}
      UNDERSTUDY_INBOUND_TOKEN: ${UNDERSTUDY_INBOUND_TOKEN:-}
      UNDERSTUDY_AGENT_TALK_CEILING: ${UNDERSTUDY_AGENT_TALK_CEILING:-}
      UNDERSTUDY_ALLOW_PRIVATE_MCP: ${UNDERSTUDY_ALLOW_PRIVATE_MCP:-}
      UNDERSTUDY_TRANSCRIBER: ${UNDERSTUDY_TRANSCRIBER:-}
      UNDERSTUDY_TRANSCRIBE_API_KEY: ${UNDERSTUDY_TRANSCRIBE_API_KEY:-}
      UNDERSTUDY_TRANSCRIBE_MODEL: ${UNDERSTUDY_TRANSCRIBE_MODEL:-}
      UNDERSTUDY_TRANSCRIBE_URL: ${UNDERSTUDY_TRANSCRIBE_URL:-}
      UNDERSTUDY_TRANSCRIBE_LANGUAGE: ${UNDERSTUDY_TRANSCRIBE_LANGUAGE:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      UNDERSTUDY_ARTIFACT_S3_BUCKET: ${UNDERSTUDY_ARTIFACT_S3_BUCKET:-}
      UNDERSTUDY_ARTIFACT_S3_ENDPOINT: ${UNDERSTUDY_ARTIFACT_S3_ENDPOINT:-}
      UNDERSTUDY_ARTIFACT_S3_REGION: ${UNDERSTUDY_ARTIFACT_S3_REGION:-}
      UNDERSTUDY_ARTIFACT_S3_ACCESS_KEY_ID: ${UNDERSTUDY_ARTIFACT_S3_ACCESS_KEY_ID:-}
      UNDERSTUDY_ARTIFACT_S3_SECRET_ACCESS_KEY: ${UNDERSTUDY_ARTIFACT_S3_SECRET_ACCESS_KEY:-}
      UNDERSTUDY_ARTIFACT_MAX_BYTES: ${UNDERSTUDY_ARTIFACT_MAX_BYTES:-}
      UNDERSTUDY_ARTIFACT_AGENT_MAX_BYTES: ${UNDERSTUDY_ARTIFACT_AGENT_MAX_BYTES:-}
      UNDERSTUDY_ARTIFACT_ORIGIN: ${UNDERSTUDY_ARTIFACT_ORIGIN:-}

  host:
    build:
      context: .
      dockerfile: apps/host/Dockerfile
    image: ${UNDERSTUDY_HOST_IMAGE:-understudy-host:local}
    restart: unless-stopped
    depends_on:
      - web
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      UNDERSTUDY_SERVER_URL: http://web:3000
      UNDERSTUDY_HOST_TOKEN: ${UNDERSTUDY_HOST_TOKEN:?set UNDERSTUDY_HOST_TOKEN in .env}
      UNDERSTUDY_HOST_ID: ${UNDERSTUDY_HOST_ID:-local}
      UNDERSTUDY_HOST_CAPACITY: ${UNDERSTUDY_HOST_CAPACITY:-}
      UNDERSTUDY_COMPUTER_IMAGE: ${UNDERSTUDY_COMPUTER_IMAGE:-understudy-computer:local}
      UNDERSTUDY_COMPUTER_NETWORK: ${UNDERSTUDY_COMPUTER_NETWORK:-understudy-agents}
      UNDERSTUDY_COMPUTER_EXTRA_HOSTS: ${UNDERSTUDY_COMPUTER_EXTRA_HOSTS:-host.docker.internal:host-gateway}
      UNDERSTUDY_ALWAYS_PULL: ${UNDERSTUDY_ALWAYS_PULL:-}
      UNDERSTUDY_COMPUTER_ENV: ${UNDERSTUDY_COMPUTER_ENV:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      UNDERSTUDY_ENABLE_CODEX: ${UNDERSTUDY_ENABLE_CODEX:-}
      UNDERSTUDY_FAKE_BRAIN: ${UNDERSTUDY_FAKE_BRAIN:-}

  computer:
    profiles: [build]
    build:
      context: .
      dockerfile: apps/computer/Dockerfile
    image: ${UNDERSTUDY_COMPUTER_IMAGE:-understudy-computer:local}

volumes:
  postgres:
